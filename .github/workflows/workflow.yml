name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize containers
        run: |
          echo "Initializing CI environment"
          docker --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 nose
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

       - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with nose
        run: |
          nosetests -v

      - name: Post Checkout
        if: always()
        run: echo "Checkout stage completed"

      - name: Post Setup Node.js
        if: always()
        run: echo "No Node.js setup required for this Python project"

      - name: Complete job
        if: success()
        run: echo "All CI steps completed successfully"
