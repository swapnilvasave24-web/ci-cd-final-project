apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before running the CI pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find /workspace/source -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "Workspace cleanup completed successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install dependencies and execute Python unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11-slim
      workingDir: /workspace/source
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install nose
        nosetests -v
